name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches version.txt
        run: test "$(cat version.txt)" = "$GITHUB_REF_NAME"
      - name: Run the tests
        run: swift test
      - name: Build the app bundle
        run: ./scripts/bundle.sh
      - name: Zip the app
        run: ditto -c -k --keepParent build/AutoREQ.app AutoREQ.zip
      - name: Extract the release notes from CHANGELOG.md
        run: awk -v tag="## $GITHUB_REF_NAME" '$0==tag{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" AutoREQ.zip --title "AutoREQ $GITHUB_REF_NAME" --notes-file notes.md
